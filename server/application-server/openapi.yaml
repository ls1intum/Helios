          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowGroupDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowGroupDto"
  /api/pullrequests/{pr}/pin:
    post:
      tags:
      - pull-request-controller
      operationId: setPrPinnedByNumber
      parameters:
      - name: pr
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: isPinned
        in: query
        required: true
        schema:
          type: boolean
      responses:
        "200":
          description: OK
  /api/pullrequests/repository/{repositoryId}/reconcile-state:
    post:
      tags:
      - pull-request-controller
      operationId: reconcilePullRequestState
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: dryRun
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestStateReconciliationResultDto"
  /api/environments/sync:
    post:
      tags:
      - environment-controller
      operationId: syncEnvironments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/environments/status:
    post:
      tags:
      - environment-status-controller
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushStatusPayload"
        required: true
      responses:
        "200":
          description: OK
  /api/deployments/{deploymentId}/decline:
    post:
      tags:
      - deployment-approval-controller
