openapi: 3.1.0
info:
  title: Helios API
  description: API documentation for the Helios application server.
  contact:
    name: Turker Koc
    email: turker.koc@tum.de
  license:
    name: MIT License
    url: https://github.com/ls1intum/Helios/blob/main/LICENSE
  version: 0.0.1
servers:
- url: /
  description: Default Server URL
paths:
  /api/workflows/{workflowId}/label:
    put:
      tags:
      - workflow-controller
      operationId: updateWorkflowLabel
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: string
              enum:
              - NONE
              - TEST
        required: true
      responses:
        "200":
          description: OK
  /api/settings/{repositoryId}/workflows/{workflowId}/deployment-config:
    get:
      tags:
      - git-repo-settings-controller
      operationId: getDeploymentWorkflowConfig
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: workflowId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentWorkflowConfigDto"
    put:
      tags:
      - git-repo-settings-controller
      operationId: upsertDeploymentWorkflowConfig
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: workflowId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentWorkflowConfigDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentWorkflowConfigDto"
  /api/settings/{repositoryId}/settings:
    get:
      tags:
      - git-repo-settings-controller
      operationId: getGitRepoSettings
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitRepoSettingsDto"
    put:
      tags:
      - git-repo-settings-controller
      operationId: updateGitRepoSettings
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitRepoSettingsDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/settings/{repositoryId}/groups/update:
    put:
      tags:
      - git-repo-settings-controller
      operationId: updateWorkflowGroups
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowGroupDto"
        required: true
      responses:
        "200":
          description: OK
  /api/environments/{id}:
    get:
      tags:
      - environment-controller
      operationId: getEnvironmentById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentDto"
    put:
      tags:
      - environment-controller
      operationId: updateEnvironment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/environments/{id}/unlock:
    put:
      tags:
      - environment-controller
      operationId: unlockEnvironment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/environments/{id}/lock:
    put:
      tags:
      - environment-controller
      operationId: lockEnvironment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/environments/{id}/extend-lock:
    put:
      tags:
      - environment-controller
      operationId: extendEnvironmentLock
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/workflows/runs/{runId}/rerun:
    post:
      tags:
      - workflow-run-controller
      operationId: reRunWorkflow
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/workflows/runs/{runId}/rerun-failed-jobs:
    post:
      tags:
      - workflow-run-controller
      operationId: reRunFailedJobs
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/workflows/runs/{runId}/cancel:
    post:
      tags:
      - workflow-run-controller
      operationId: cancelWorkflowRun
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/workflows/repository/{repositoryId}/sync:
    post:
      tags:
      - workflow-controller
      operationId: syncWorkflowsByRepositoryId
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/user/settings:
    get:
      tags:
      - user-controller
      operationId: getUserSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingsDto"
    post:
      tags:
      - user-controller
      operationId: updateUserSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsDto"
        required: true
      responses:
        "200":
          description: OK
  /api/user/notification-preferences:
    get:
      tags:
      - user-controller
      operationId: getNotificationPreferences
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationPreferenceDto"
    post:
      tags:
      - user-controller
      operationId: updateNotificationPreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesWrapper"
        required: true
      responses:
        "200":
          description: OK
  /api/settings/{repositoryId}/secret:
    post:
      tags:
      - git-repo-settings-controller
      operationId: rotateSecret
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
  /api/settings/{repositoryId}/groups/create:
    post:
      tags:
      - git-repo-settings-controller
      operationId: createWorkflowGroup
      parameters:
      - name: repositoryId
        in: path
        required: true
