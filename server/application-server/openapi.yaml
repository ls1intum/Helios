          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDeploymentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionDto"
  /api/deployments/{deploymentId}/approve:
    post:
      tags:
      - deployment-approval-controller
      operationId: approve
      parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionDto"
  /api/deployments/deploy:
    post:
      tags:
      - deployment-controller
      operationId: deployToEnvironment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
  /api/deployments/cancel:
    post:
      tags:
      - deployment-controller
      operationId: cancelDeployment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelDeploymentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
  /api/branches/repository/{repoId}/pin:
    post:
      tags:
      - branch-controller
      operationId: setBranchPinnedByRepositoryIdAndNameAndUserId
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
