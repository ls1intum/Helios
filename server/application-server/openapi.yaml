        in: query
        required: true
        schema:
          type: string
      - name: isPinned
        in: query
        required: true
        schema:
          type: boolean
      responses:
        "200":
          description: OK
  /status/health:
    get:
      tags:
      - status-controller
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
  /api/workflows:
    get:
      tags:
      - workflow-controller
      operationId: getAllWorkflows
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowDto"
  /api/workflows/{id}:
    get:
      tags:
      - workflow-controller
      operationId: getWorkflowById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDto"
  /api/workflows/state/{state}:
    get:
      tags:
      - workflow-controller
      operationId: getWorkflowsByState
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
          enum:
          - ACTIVE
          - DELETED
          - DISABLED_FORK
          - DISABLED_INACTIVITY
          - DISABLED_MANUALLY
          - UNKNOWN
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowDto"
  /api/workflows/runs:
    get:
      tags:
      - workflow-run-controller
      operationId: getWorkflowRuns
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortField
        in: query
        required: false
        schema:
          type: string
      - name: sortDirection
        in: query
        required: false
        schema:
          type: string
      - name: filterType
        in: query
        required: false
        schema:
          type: string
          enum:
          - ALL
          - NOT_STARTED
          - IN_PROGRESS
          - CANCELLED
          - SUCCESS
          - FAILURE
          - ACTION_REQUIRED
      - name: searchTerm
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWorkflowRunsResponse"
  /api/workflows/runs/{runId}:
    get:
      tags:
      - workflow-run-controller
      operationId: getWorkflowRunById
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunDto"
  /api/workflows/repository/{repositoryId}:
