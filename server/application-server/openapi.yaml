      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryInfoDto"
  /api/pullrequests:
    get:
      tags:
      - pull-request-controller
      operationId: getPullRequests
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortField
        in: query
        required: false
        schema:
          type: string
      - name: sortDirection
        in: query
        required: false
        schema:
          type: string
      - name: filterType
        in: query
        required: false
        schema:
          type: string
          default: OPEN
          enum:
          - ALL
          - OPEN
          - OPEN_READY_FOR_REVIEW
          - DRAFT
          - MERGED
          - CLOSED
          - USER_AUTHORED
          - ASSIGNED_TO_USER
          - REVIEW_REQUESTED
      - name: searchTerm
        in: query
        required: false
        schema:
          type: string
      - name: author
        in: query
        required: false
        schema:
          type: string
      - name: assignee
        in: query
        required: false
        schema:
          type: string
      - name: noAssignee
        in: query
        required: false
        schema:
          type: boolean
      - name: labelId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: noLabel
        in: query
        required: false
        schema:
          type: boolean
      - name: reviewState
        in: query
        required: false
        schema:
          type: string
          enum:
          - NONE
          - REQUIRED
      - name: requestedReviewer
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPullRequestsResponse"
  /api/pullrequests/{id}:
