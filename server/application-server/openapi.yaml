      - pull-request-controller
      operationId: getPullRequestByRepositoryIdAndNumber
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: number
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestInfoDto"
  /api/pullrequests/repository/{repoId}/filter-options:
