plugins {
    id 'org.springframework.boot' version '4.2.0' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '9.8.3' apply false
    id 'java'
}

allprojects {
    group = 'de.tum.cit.aet'

    repositories {
        // Preferred Maven Central mirror hosted in TUM AET infrastructure (avoids upstream 429 rate-limit errors during dependency resolution)
        maven {
            name = "reposiliteRepository"
            url = "https://reposilite.aet.cit.tum.de/releases"
        }
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    jacoco {
        toolVersion = '0.8.16'
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            csv.required = false
        }
    }
}
