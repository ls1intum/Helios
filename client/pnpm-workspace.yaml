verifyDepsBeforeRun: false
nodeLinker: hoisted

# Keep a single-document lockfile readable by GitHub's dependency graph (pnpm/pnpm#13805).
# CI and Docker install the exact pnpm version pinned in package.json explicitly.
pmOnFail: ignore

# TEMPORARY (2026-05-28): pnpm 11.3+ defaults to a 24h `minimumReleaseAge` supply-chain
# policy that blocks `pnpm install --frozen-lockfile` on any lockfile entry younger than
# the cutoff. `@angular/cdk@21.2.13` (in staging since #1093 yesterday) is currently ~16h
# old, so every PR's CI client install fails. Relaxed to 0 to unblock the staging deploy
# and the parallel testing of feat/deployment-approval-in-helios (#1098) on helios-staging.
# REVERT (restore default by removing this line, or set back to 86400) once the package
# ages past the cutoff later today.
minimumReleaseAge: 0

# pnpm 11 blocks dependency build scripts by default and, under
# --frozen-lockfile, fails hard (ERR_PNPM_IGNORED_BUILDS) unless each package is
# explicitly approved. `allowBuilds` is pnpm 11's replacement for the old
# `onlyBuiltDependencies` key. These are the native/tooling packages that ship
# build scripts; their platform binaries come from optional deps, so the build
# works on linux/CI once they're approved here.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# Keep security overrides current while preserving the existing toolchain choices.
# The existing cross-major overrides are retained, with only compatible updates.
overrides:
  webpack-dev-server: 6.1.0
  uuid: 14.0.3
  undici@6: 8.12.3
  undici@7: 8.12.3
  hono: 4.13.13
  tar: 7.5.22
  piscina: 5.3.2
  http-proxy-middleware: 4.2.0
  launch-editor: 2.14.2
  js-yaml: 5.5.0
  '@babel/core@7': 8.0.10
  '@babel/core@8': 8.0.9
  esbuild: 0.28.2
  # Angular 22's compiler imports the range-mapping API introduced in 1.6.
  '@jridgewell/sourcemap-codec': 1.6.0
  # Patch vulnerable transitive build/lint dependencies within their existing major lines.
  'brace-expansion@1': 1.1.21
  'brace-expansion@5': 5.0.12
  'fast-uri@3': 3.1.9
  'immutable@5': 5.1.9
  # @angular/build pins Vite exactly; patch its copy as well as the direct dependency.
  'vite@8': 8.3.5
