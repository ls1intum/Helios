<div class="mt-4 mb-5 flex items-start justify-between">
  @if (query.data(); as branch) {
    <div class="flex flex-col items-start gap-2">
      <div class="mb-1 flex gap-2 items-center flex-wrap">
        <i-tabler name="git-branch" class="text-muted-color !size-5" />
        <h2 class="text-2xl">{{ branch.name }}</h2>
      </div>
      <div class="flex items-center gap-2">
        <h4 class="text-xl">Last commit:</h4>
        <h4 [innerHTML]="$safeNavigationMigration(commit()?.message) | markdown"></h4>
        @if (commit()?.sha) {
          <h4 class="font-mono">({{ commit()!.sha.substring(0, 7) }})</h4>
        }
      </div>
    </div>
  } @else {
    <div class="flex flex-col items-start gap-2">
      <p-skeleton width="8rem" height="1rem" />
      <p-skeleton width="10rem" height="2rem" />
    </div>
  }
</div>

<div class="flex flex-col gap-6">
  <app-pipeline [selector]="pipelineSelector()" />
  @if (query.data(); as branch) {
    <p-divider />
    <p-tabs [value]="deploymentTab()" (valueChange)="onDeploymentTabChange($event)">
      <p-tablist>
        <p-tab value="deploy">Deploy</p-tab>
        <p-tab value="history">Deployment History</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="deploy">
          <app-deployment-selection [branchName]="branch.name" [commitSha]="branch.commitSha" />
        </p-tabpanel>
        <p-tabpanel value="history">
          <app-deployment-history [selector]="{ repositoryId: repositoryId(), branchName: branch.name }" />
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</div>
