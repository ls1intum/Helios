name: Linting
on: [pull_request]
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  checkstyle:
    name: Linting Server (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dbelyaev/action-checkstyle@v4.4.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          checkstyle_config: ./server/checkstyle.xml
          checkstyle_version: 14.3.0
          fail_on_error: true
  lint-client:
    name: Linting Client (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install modules
        working-directory: ./client
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        working-directory: ./client
        run: pnpm exec eslint --max-warnings 0 .
  lint-keycloakify:
    name: Linting Keycloakify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: keycloakify/pnpm-lock.yaml
      - name: Install modules
        working-directory: ./keycloakify
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        working-directory: ./keycloakify
        run: pnpm exec eslint --max-warnings 0 .
