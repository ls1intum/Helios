name: Flyway Validation

on:
  pull_request:
    branches: [staging]
  workflow_call: {}
  push:
    branches: [staging]

permissions:
  contents: read

env:
  DATASOURCE_URL: jdbc:postgresql://localhost:5432/helios
  DATASOURCE_USERNAME: helios
  DATASOURCE_PASSWORD: helios

jobs:
  validate-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11-alpine

        env:
          POSTGRES_USER: ${{ env.DATASOURCE_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.DATASOURCE_PASSWORD }}
          POSTGRES_DB: helios
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check existing migrations are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Checkout's full history already includes the PR's base and head commits.
          # Compare immutable commits without fetching or checking out an untrusted branch.
          CHANGED_PATHS=$(git diff --name-status "$BASE_SHA...$HEAD_SHA" -- server/application-server/src/main/resources/db/migration/)

          if [[ -z "$CHANGED_PATHS" ]]; then
            echo "No Flyway migration changes detected."
          else
            echo "Flyway migration changes detected:"
            echo "$CHANGED_PATHS"

            if echo "$CHANGED_PATHS" | grep -q "^[^A]"; then
              echo "Error: One or more existing migrations were changed."
              exit 1
            else
              echo "No existing migrations were changed."
            fi
          fi

      # Dependencies, database images, and configuration can break migrations without SQL changes.
      # Always exercise the complete schema for PRs, pushes, and reusable workflow calls.
      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Run Gradle to apply Flyway migrations
        working-directory: ./server
        run: ./gradlew flywayMigrate

      - name: Run Gradle to validate Flyway migrations
        working-directory: ./server
        run: ./gradlew flywayValidate
